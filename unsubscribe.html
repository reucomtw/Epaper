<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取消訂閱</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f6f0;
      color: #222;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    main {
      width: min(92vw, 460px);
      margin: 10vh auto;
      background: #fff;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      color: #5d2d91;
      font-size: 24px;
    }

    p {
      color: #555;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      color: #333;
      font-size: 16px;
      padding: 12px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 6px;
      background: #7f00ff;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 16px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      color: #7f00ff;
      font-weight: 700;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <main>
    <h1>取消訂閱</h1>
    <p id="description">請確認要從桃園社企中心電子報名單中移除的電子郵件。</p>

    <label for="email">電子郵件</label>
    <input id="email" type="email" autocomplete="email">

    <button id="unsubscribeButton" type="button" disabled>送出取消訂閱</button>
    <p id="message" class="message">載入中...</p>
  </main>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzQgYV06glucSUHjoa_miMfeS_i0d0O6TaGGSmjlttM0Pv4QkUX_qGV30rzrZUXMOjDYw/exec';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const emailInput = document.getElementById('email');
    const button = document.getElementById('unsubscribeButton');
    const message = document.getElementById('message');
    const description = document.getElementById('description');
    let tokenEmail = '';

    function setMessage(text, isError) {
      message.textContent = text;
      message.className = isError ? 'message error' : 'message';
    }

    function callBackend(action, onResult) {
      const callbackName = 'unsubscribeCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const script = document.createElement('script');
      const url = new URL(WEB_APP_URL);

      window[callbackName] = function(result) {
        delete window[callbackName];
        script.remove();
        onResult(result || {});
      };

      url.searchParams.set('action', action);
      url.searchParams.set('token', token);
      url.searchParams.set('email', emailInput.value.trim());
      url.searchParams.set('callback', callbackName);

      script.onerror = function() {
        delete window[callbackName];
        script.remove();
        setMessage('連線失敗，請稍後再試。', true);
      };

      script.src = url.toString();
      document.body.appendChild(script);
    }

    if (!token) {
      description.textContent = '請輸入要從桃園社企中心電子報名單中移除的電子郵件。';
      button.textContent = '送出取消訂閱';
      button.disabled = false;
      setMessage('請輸入電子郵件後送出。', false);
    } else {
      callBackend('lookup', function(result) {
        if (!result.ok) {
          setMessage(result.message || '退訂連結無效或已經取消訂閱。', true);
          return;
        }

        tokenEmail = result.email || '';
        emailInput.value = tokenEmail;
        button.disabled = false;
        setMessage('請確認電子郵件，若有錯誤可修改後送出。', false);
      });
    }

    button.addEventListener('click', function() {
      if (!token && !emailInput.value.trim()) {
        setMessage('請輸入電子郵件。', true);
        return;
      }

      button.disabled = true;
      setMessage('處理中...', false);

      const currentEmail = emailInput.value.trim().toLowerCase();
      const action = token && currentEmail === tokenEmail ? 'unsubscribe' : 'unsubscribeByEmail';

      callBackend(action, function(result) {
        if (!result.ok) {
          button.disabled = false;
          setMessage(result.message || '取消訂閱失敗，請稍後再試。', true);
          return;
        }

        setMessage(result.message || ('已取消訂閱：' + (result.email || emailInput.value)), false);
      });
    });
  </script>
</body>
</html>
