<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取消訂閱</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f6f0;
      color: #222;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    main {
      width: min(92vw, 460px);
      margin: 10vh auto;
      background: #fff;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      color: #5d2d91;
      font-size: 24px;
    }

    p {
      color: #555;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      color: #333;
      font-size: 16px;
      padding: 12px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 6px;
      background: #7f00ff;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 16px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      color: #7f00ff;
      font-weight: 700;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <main>
    <h1>取消訂閱</h1>
    <p>請確認或輸入要從桃園社企中心電子報名單中移除的電子郵件。</p>

    <label for="email">電子郵件</label>
    <input id="email" type="email" autocomplete="email" placeholder="your@email.com">

    <button id="unsubscribeButton" type="button" disabled>送出取消訂閱</button>
    <p id="message" class="message">正在確認電子郵件請稍後</p>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import {
      getFirestore,
      doc,
      getDoc,
      serverTimestamp,
      updateDoc
    } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'PASTE_FIREBASE_WEB_API_KEY_HERE',
      authDomain: 'epaper-71b93.firebaseapp.com',
      projectId: 'epaper-71b93',
      storageBucket: 'epaper-71b93.firebasestorage.app',
      messagingSenderId: 'PASTE_MESSAGING_SENDER_ID_HERE',
      appId: 'PASTE_FIREBASE_APP_ID_HERE'
    };

    const params = new URLSearchParams(window.location.search);
    const token = (params.get('token') || '').trim();
    const emailInput = document.getElementById('email');
    const button = document.getElementById('unsubscribeButton');
    const message = document.getElementById('message');

    let recipientRef = null;
    let tokenEmail = '';
    let userEditedEmail = false;

    emailInput.addEventListener('input', function() {
      userEditedEmail = true;
    });

    function setMessage(text, isError) {
      message.textContent = text;
      message.className = isError ? 'message error' : 'message';
    }

    function hasMissingFirebaseConfig() {
      return Object.values(firebaseConfig).some(function(value) {
        return String(value).indexOf('PASTE_') === 0;
      });
    }

    async function loadRecipient() {
      if (!token) {
        setMessage('請從電子報中的取消訂閱連結進入。', true);
        return;
      }

      if (hasMissingFirebaseConfig()) {
        setMessage('Firebase 設定尚未完成，請先填入 firebaseConfig。', true);
        return;
      }

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      recipientRef = doc(db, 'recipients', token);

      const snapshot = await getDoc(recipientRef);

      if (!snapshot.exists()) {
        setMessage('退訂連結無效或已經取消訂閱。', true);
        return;
      }

      const data = snapshot.data();

      if (data.status !== 'active') {
        setMessage('此電子郵件已取消訂閱。', false);
        return;
      }

      tokenEmail = String(data.email || '').trim().toLowerCase();

      if (!userEditedEmail) {
        emailInput.value = tokenEmail;
      }

      button.disabled = false;
      setMessage('請確認電子郵件，若有錯誤可修改後送出。', false);
    }

    button.addEventListener('click', async function() {
      const currentEmail = emailInput.value.trim().toLowerCase();

      if (!recipientRef) {
        setMessage('退訂連結尚未載入完成，請稍後再試。', true);
        return;
      }

      if (!currentEmail) {
        setMessage('請輸入電子郵件。', true);
        return;
      }

      button.disabled = true;
      setMessage('處理中...', false);

      try {
        await updateDoc(recipientRef, {
          email: currentEmail,
          status: 'unsubscribed',
          unsubscribedAt: serverTimestamp()
        });

        setMessage('已取消訂閱：' + currentEmail, false);
      } catch (error) {
        button.disabled = false;
        setMessage('取消訂閱失敗，請稍後再試。', true);
        console.error(error);
      }
    });

    loadRecipient().catch(function(error) {
      console.error(error);
      setMessage('載入失敗，請稍後再試。', true);
    });
  </script>
</body>
</html>
